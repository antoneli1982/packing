name: Aplicar notas de turno

on:
  push:
    branches: [main]
    paths:
      - 'notas-turno.patch'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar alteração
        shell: bash
        run: |
          set -euo pipefail
          git apply --check notas-turno.patch
          git apply notas-turno.patch
          rm -f notas-turno.patch .github/workflows/apply-notas-turno.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html notas-turno.patch .github/workflows/apply-notas-turno.yml
          git commit -m "Adicionar notas de passagem de turno"
          git push origin HEAD:main
